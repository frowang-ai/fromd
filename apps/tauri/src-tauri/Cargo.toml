[package]
name = "frowd-tauri"
version = "0.5.2"
description = "frowd document workspace derived from SoloMD v5.0.21 Tauri foundation"
authors = ["Fro <frostianw@gmail.com>"]
license = "MIT"
edition = "2021"
autobins = false

[[bin]]
name = "frowd-tauri"
path = "src/main.rs"
[lib]
name = "frowd_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Size profile retained from SoloMD v5.0.21.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
incremental = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2.7.0", default-features = false, features = ["xdg-portal"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-opener = "=2.7.0"
percent-encoding = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
frowd-documents = { path = "../crates/document-store" }
base64 = "0.22.1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "native-tls"] }
semver = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com"] }
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSError", "NSDictionary", "NSGeometry", "NSURL"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "WKWebView", "WKWebViewConfiguration", "WKPreferences", "block2", "objc2-app-kit"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPrintInfo", "NSPrintOperation", "NSWindow", "NSResponder", "NSView", "objc2-core-foundation"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
