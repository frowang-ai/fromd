[package]
name = "frowd-tauri"
version = "0.5.0"
description = "frowd document workspace derived from SoloMD v5.0.21 Tauri foundation"
authors = ["Fro <frostianw@gmail.com>"]
license = "MIT"
edition = "2021"
autobins = false

[[bin]]
name = "frowd-tauri"
path = "src/main.rs"
[lib]
name = "frowd_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Size profile retained from SoloMD v5.0.21.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
incremental = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2.7.0", default-features = false, features = ["xdg-portal"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-opener = "=2.7.0"
percent-encoding = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
frowd-documents = { path = "../crates/document-store" }
[features]
custom-protocol = ["tauri/custom-protocol"]
