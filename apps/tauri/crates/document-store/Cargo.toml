[package]
name = "frowd-documents"
version = "0.5.0"
edition = "2021"
license = "MIT"
[lib]
path = "../../src-tauri/src/documents.rs"
[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
thiserror = "2"
