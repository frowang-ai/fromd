[package]
name = "frowd-documents"
version = "0.5.0"
edition = "2021"
license = "MIT"
[lib]
path = "src/lib.rs"
[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
thiserror = "2"

image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pulldown-cmark = { version = "=0.13.6", default-features = false, features = ["html"] }
html5ever = "=0.39.0"
percent-encoding = "=2.3.2"
roxmltree = "=0.21.1"
cssparser = "=0.37.0"
quick-xml = "=0.39.2"

# roxmltree parses element nesting recursively. Optimize it in debug builds so a
# valid 128-level SVG fits the default 2 MiB thread stack, as it does in release.
[profile.dev.package.roxmltree]
opt-level = 2
