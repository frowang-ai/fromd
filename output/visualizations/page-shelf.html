<!doctype html>
<html lang="zh-CN">
<head>

<title>页面收起 · Frowang Markdown 交互预览</title>
<style>
:root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; color: #2b3933; background: #f7f8f5; --ink:#263b32; --muted:#829087; --line:#e5e9e2; --green:#42715c; --soft:#edf3ed; --rail:68px; }

.rail-bottom { margin-top:auto; width:29px; height:29px; border-radius:50%; background:#e7ece2; color:#9aab91; display:grid; place-items:center; font:14px Georgia,serif; }

.paper-status { margin-left:auto; font-size:11px; color:#8b9b87; letter-spacing:0; }
.title-input { display:block; width:100%; padding:0; color:#2c4032; border:0; outline:none; background:none; font-size:28px; font-weight:600; letter-spacing:-.6px; line-height:1.6; margin-bottom:12px; }

.prose .eyebrow { color:#9aa38e; font-size:12px; letter-spacing:.7px; }

.prose hr { border:0; border-top:1px solid #ecefe5; margin:28px 0; }

.paper-tail { color:#a0aa96; font-size:11px; margin-top:40px; display:flex; align-items:center; gap:9px; }
.paper-tail::before { content:""; display:block; width:24px; border-top:1px solid #d9e0cf; }
.empty { height:100%; min-height:300px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; color:#879180; padding:24px; }
.empty-stack { position:relative; width:86px; height:104px; margin-bottom:24px; }
.empty-stack::before, .empty-stack::after, .empty-stack span { content:""; display:block; position:absolute; inset:0; background:#fffefa; border:1px solid #d9e1d2; border-radius:8px; }
.empty-stack::before { transform:rotate(-12deg) translate(-9px,3px); background:#eff2e8; }
.empty-stack::after { transform:rotate(9deg) translate(9px,1px); background:#f6f7f0; }
.empty-stack span { z-index:1; display:grid; place-items:center; color:#91a47f; }
.empty-stack svg { width:32px; height:32px; }
.empty h1 { font-size:23px; font-weight:500; color:#4f664a; margin:12px 0 8px; }
.empty p { font-size:13px; line-height:1.9; margin:0 0 23px; }
.primary { background:#496c51; color:#fff; border-radius:7px; padding:11px 20px; font-size:13px; }
.primary:hover { background:#36583e; }
.backdrop { position:absolute; inset:59px 0 0 var(--rail); background:#263c2d18; z-index:7; opacity:0; visibility:hidden; transition:opacity .22s,visibility .22s; }
.backdrop.visible { opacity:1; visibility:visible; }
.shelf { position:absolute; left:calc(var(--rail) + 13px); top:71px; bottom:13px; width:306px; z-index:8; display:flex; flex-direction:column; background:#f5f7f1; border:1px solid #dfe6d8; border-radius:14px; box-shadow:0 14px 55px #20362620,0 2px 6px #20362607; transform:translateX(-18px) scale(.98); transform-origin:left center; opacity:0; visibility:hidden; transition:transform .23s cubic-bezier(.2,.8,.2,1),opacity .18s,visibility .23s; }
.shelf.visible { transform:none; opacity:1; visibility:visible; }
.shelf-head { padding:20px 20px 14px; }
.shelf-heading { display:flex; align-items:center; justify-content:space-between; }
.shelf-heading h2 { font-size:19px; margin:0; font-weight:600; letter-spacing:1px; }
.icon-button { width:28px; height:28px; display:grid; place-items:center; border-radius:6px; color:#889481; }
.icon-button:hover { background:#e6ecdf; color:#46643f; }
.shelf-head p { font-size:12px; color:#909c85; margin:6px 0 17px; }
.search-wrap { display:flex; align-items:center; border:1px solid #e0e6d9; background:#fbfcf8; border-radius:7px; padding:7px 10px; gap:8px; }
.search-wrap svg { width:15px; height:15px; color:#9da991; flex-shrink:0; }
.search-wrap input { border:0; outline:none; background:none; font-size:12px; width:100%; color:#516549; padding:2px 0; }
.search-wrap input::placeholder { color:#a3ac98; }
.filters { display:flex; gap:17px; margin-top:15px; }
.filter { padding:0 0 7px; color:#97a08d; font-size:12px; border-bottom:2px solid transparent; }
.filter.active { color:#4e7148; border-bottom-color:#86a178; }
.cards { overflow:auto; scrollbar-width:thin; scrollbar-color:#cdd8c4 transparent; padding:1px 19px 16px; display:flex; flex-direction:column; gap:15px; min-height:0; }
.card { flex-shrink:0; position:relative; }
.card-open { display:block; width:100%; padding:0; text-align:left; border-radius:8px; }
.card-sheet { height:160px; background:#fffefa; border:1px solid #e0e5d8; border-radius:7px; overflow:hidden; position:relative; box-shadow:0 2px 4px #29402604; transition:box-shadow .18s,border-color .18s,transform .18s; }
.card-open:hover .card-sheet { border-color:#a0b494; box-shadow:0 5px 15px #324d2510; transform:translateY(-2px); }
.card.active .card-sheet { border-color:#92aa83; }
.thumbnail { width:680px; padding:92px 44px 33px; transform:scale(.39); transform-origin:left top; pointer-events:none; user-select:none; }
.thumbnail h1 { font-size:27px; color:#3d553e; margin:0 0 13px; }
.thumbnail .prose { font-size:16px; line-height:1.8; }
.thumbnail .prose h2 { margin-top:20px; }
.card-shade { position:absolute; bottom:0; left:0; right:0; height:35px; background:linear-gradient(transparent,#fffefa); pointer-events:none; }
.badge { position:absolute; top:10px; left:10px; border-radius:4px; padding:3px 6px; font-size:10px; background:#edf3e7; color:#6e8a60; border:1px solid #e0e8d7; }
.badge.shelved { background:#f2f2ec; border-color:#e6e7dc; color:#9a9e88; }
.card-label { display:flex; align-items:center; padding:9px 32px 0 2px; gap:8px; }
.card-title { font-size:12px; color:#56694e; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card-number { margin-left:auto; color:#b0b8a4; font-size:10px; font-variant-numeric:tabular-nums; }
.card-more { position:absolute; right:-2px; bottom:-3px; }
.card-menu { position:absolute; bottom:28px; right:0; z-index:2; padding:5px; border:1px solid #e4e6dc; border-radius:8px; background:#fffefb; box-shadow:0 6px 25px #263c2920; min-width:134px; }
.card-menu button { display:flex; align-items:center; gap:9px; width:100%; padding:9px 10px; font-size:12px; color:#a06d60; border-radius:5px; }
.card-menu button:hover { background:#f8efeb; }
.card-menu svg { width:15px; height:15px; }
.shelf-foot { margin-top:auto; padding:12px 19px; border-top:1px solid #e3e8dc; color:#9aa58e; font-size:11px; display:flex; justify-content:space-between; }
.cards-empty { color:#8b9981; text-align:center; padding:35px 5px; font-size:13px; }
.footer { display:flex; gap:12px; align-items:center; padding:0 19px; background:#f5f7f1; border-top:1px solid var(--line); font-size:11px; color:#8e9986; z-index:10; }
.footer-tip { color:#788c6d; }
.footer-controls { margin-left:auto; display:flex; align-items:center; gap:17px; flex-shrink:0; }
.slow { display:flex; align-items:center; gap:6px; cursor:pointer; }
.slow input { accent-color:#63875a; width:13px; height:13px; margin:0; }
.reset { font-size:11px; color:#8f9b86; padding:4px 0; border-bottom:1px solid #cfd8c7; }
.toast { position:fixed; left:calc(50% + 34px); bottom:62px; transform:translate(-50%,12px); z-index:30; display:flex; align-items:center; gap:14px; padding:13px 18px; border:1px solid #dfe7d6; border-radius:10px; background:#fcfdf7; box-shadow:0 7px 25px #2e49231a; font-size:12px; color:#647a57; opacity:0; visibility:hidden; transition:.2s; max-width:calc(100vw - 35px); }
.toast.visible { opacity:1; transform:translate(-50%,0); visibility:visible; }
.toast-message { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.toast-action { color:#4d7440; white-space:nowrap; font-size:12px; font-weight:600; }
.toast-close { padding:0; color:#a2ac97; }
.toast-close svg { width:14px; height:14px; }
.flight { position:fixed; z-index:50; pointer-events:none; overflow:hidden; background:#fffefa; border:1px solid #dce5d3; border-radius:5px; box-shadow:0 16px 60px #1f3c3029; transform-origin:top left; }
.flight .paper { margin:0; max-width:none; min-height:0; box-shadow:none; border:0; }
.flight .paper input { pointer-events:none; }
@media (min-width:1500px) { .viewport { padding-top:65px; } .paper { max-width:900px; padding:35px 70px 70px; } }
@media (max-width:850px) { .viewport { padding:26px 22px 60px; } .paper { padding:25px 30px 45px; } .tabbar { padding:0 12px; } .top-right { display:none; } }
@media (max-width:560px) { :root { --rail:51px; } .topbar { padding:0 14px; } .brand { font-size:12px; } .top-divider { margin:0 1px; } .rail { padding:17px 3px 12px; } .rail-button { width:42px; } .viewport { padding:20px 12px 55px; } .paper { padding:22px 20px 40px; min-height:550px; } .paper-status { display:none; } .paper-meta { margin-bottom:18px; } .title-input { font-size:23px; } .prose { font-size:14px; } .tab { min-width:123px; max-width:190px; padding-left:8px; } .tabbar { padding:0 5px; } .shelf { left:calc(var(--rail) + 7px); width:min(306px,calc(100vw - var(--rail) - 15px)); top:67px; bottom:8px; } .footer { padding:0 10px; gap:5px; } .footer-tip { display:none; } .footer-controls { gap:11px; } .toast { left:50%; } .preview-tag { font-size:11px; } }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none !important; scroll-behavior:auto !important; } }
</style>
</head>
<body>
<div id="page-shelf-preview">
  <header class="topbar"><span class="brand-mark">f</span><span class="brand">Frowang Markdown</span><span class="top-divider"></span><span class="preview-tag">页面收起 · 交互预览</span><span class="top-right">留一点空间，给正在想的事</span></header>
  <div class="workspace">
    <nav class="rail" aria-label="页面导航">
      <button id="shelf-toggle" class="rail-button" aria-label="查看所有页面" aria-expanded="false" aria-controls="shelf" title="所有页面 · 收起的页面也在这里"><span data-icon="pages"></span><span>页面</span><span class="page-count" id="page-count">5</span></button>
      <button id="rail-new" class="rail-button" aria-label="新建页面" title="新建页面"><span data-icon="plus"></span><span>新建</span></button>
      <span class="rail-bottom" aria-hidden="true">f</span>
    </nav>
    <main class="main">
      <div class="tabbar"><div class="tabs" id="tabs" role="tablist" aria-label="打开的页面"></div><button id="new-tab" class="new-tab" aria-label="新建页面" title="新建页面"><span data-icon="plus"></span></button></div>
      <div class="viewport" id="viewport" role="tabpanel" aria-label="页面内容">
        <article class="paper" id="paper">
          <div class="paper-meta"><span class="line"></span><span id="paper-category">阅读笔记</span><span class="paper-status" id="paper-status">演示草稿 · 可以直接编辑</span></div>
          <input class="title-input" id="page-title" aria-label="页面标题" maxlength="100" spellcheck="false">
          <div id="editor" class="prose" contenteditable="plaintext-only" role="textbox" aria-label="页面正文" aria-multiline="true" spellcheck="false"></div>
          <div class="paper-tail">暂时放下，也可以随时接着读。</div>
        </article>
        <section class="empty" id="empty" hidden><div class="empty-stack" aria-hidden="true"><span data-icon="pages"></span></div><h1 id="empty-title">桌面清空了，页面还在。</h1><p id="empty-copy">它们被收在左侧。<br>打开页面列表，继续刚才的思路。</p><button id="empty-action" class="primary">查看收起的页面</button></section>
      </div>
    </main>
    <div id="backdrop" class="backdrop" aria-hidden="true"></div>
    <aside id="shelf" class="shelf" aria-label="所有页面" inert>
      <div class="shelf-head"><div class="shelf-heading"><h2>页面</h2><button id="shelf-close" class="icon-button" aria-label="收起页面面板"><span data-icon="chevron"></span></button></div><p>收起来，也随时找得到。</p><div class="search-wrap"><span data-icon="search"></span><input id="search" aria-label="搜索页面" placeholder="找一页…" autocomplete="off"></div><div class="filters" aria-label="页面筛选"><button class="filter active" data-filter="all" aria-pressed="true">全部 <span id="all-count">5</span></button><button class="filter" data-filter="shelved" aria-pressed="false">已收起 <span id="shelved-count">2</span></button></div></div>
      <div class="cards" id="cards"></div>
      <div class="shelf-foot"><span>点击卡片，展开页面</span><span>··· 中可删除</span></div>
    </aside>
  </div>
  <footer class="footer"><span>示例内容 · 刷新重置</span><span class="footer-tip">试试标签上的 −，把一页暂时收起来</span><div class="footer-controls"><label class="slow"><input type="checkbox" id="slow">慢动作</label><button class="reset" id="reset">重置示例</button></div></footer>
  <div class="toast" id="toast" role="status"><span class="toast-message" id="toast-message"></span><button class="toast-action" id="toast-action" hidden></button><button class="toast-close" id="toast-close" aria-label="关闭提示"><span data-icon="close"></span></button></div>
</div>
<script>
(() => {
  'use strict';
  const root = document.getElementById('page-shelf-preview');
  const $ = id => document.getElementById(id);
  const icons = {
    pages:'<rect x="5" y="5" width="14" height="16" rx="2"/><path d="M8 2H4a2 2 0 0 0-2 2v12M9 10h6M9 14h6"/>',
    plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>',
    search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',
    chevron:'<path d="m14 6-6 6 6 6"/>', close:'<path d="m6 6 12 12M18 6 6 18"/>',
    more:'<circle cx="5" cy="12" r=".8"/><circle cx="12" cy="12" r=".8"/><circle cx="19" cy="12" r=".8"/>',
    trash:'<path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/>'
  };
  const icon = name => `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`;
  root.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon); });
  const samples = [
    { id:'pnas', title:'PNAS · 修改备忘', category:'论文修改', html:'<p class="eyebrow">REVISION NOTES / 第一轮讨论</p><p>把这次讨论里需要改的地方先记下来。先整理问题，再回到论文里逐一修改。</p><h2>01　先把统计结果说清楚</h2><ol><li>附录 E1：把 joint test 的 <em>p</em> 值放在对应结果旁边，读者不用再来回找。</li><li>正文里解释清楚：单个系数与整体检验回答的是不同的问题。</li><li>表注统一说明标准误、控制变量和样本范围。</li></ol><blockquote>一个提醒：先让读者明白我们在比较什么，再给出检验结果。</blockquote><h2>02　把讨论留到下一次</h2><p>这里还需要对照一下原始结果。暂时收起来，等核完表格再继续。</p><hr><p><strong>下一步</strong>　核对附录 → 调整表注 → 通读这一段解释。</p>' },
    { id:'benchmark', title:'社科科研 Benchmark', category:'研究想法', html:'<p class="eyebrow">RESEARCH NOTE / 一个还在生长的问题</p><p>如果让 Agent 参与一项完整研究，我们应该评价它的哪一部分？</p><h2>不只看最后的答案</h2><p>研究从来不只是回答一道题。选问题、找证据、选择方法、解释结果，每一步都在改变后面的可能性。</p><ul><li><strong>问题形成</strong>：能否把模糊想法变成可研究的问题？</li><li><strong>证据使用</strong>：结论是否被材料支持？</li><li><strong>方法判断</strong>：知道哪些结果不能这样解释。</li></ul><blockquote>也许最有意思的评价对象，是它在信息不完整时如何做决定。</blockquote><h2>一个最小的实验</h2><p>从一份材料开始，让不同模型写出研究路径。先观察差异，再决定如何评分。</p>' },
    { id:'comparison', title:'人类与 AI 的能力边界', category:'阅读摘记', html:'<p class="eyebrow">READING / 摘要与自己的想法</p><h2>能力是一条谱系</h2><p>我们习惯用一个分数比较表现，但任务的结构可能比总分更重要。</p><div class="formula">表现 = 能力 × 情境 × 可获得的工具</div><p>同一个模型，在不同的提示、信息与反馈下，可能呈现很不一样的行为。</p><h2>值得追问的地方</h2><ul><li>比较时，双方拿到的信息真的相同吗？</li><li>哪些步骤可以借助工具，哪些必须独立完成？</li><li>失败是知识缺失，还是不善于判断不确定性？</li></ul><blockquote>把“谁更强”改成“在什么条件下，谁更适合做什么”。</blockquote>' },
    { id:'week', title:'这周想读的东西', category:'阅读清单', html:'<p class="eyebrow">THIS WEEK / 慢一点也没关系</p><h2>三篇就够</h2><ul><li>一篇关于科学发现的文章</li><li>一篇方法论文，重点看它如何验证</li><li>一篇跨学科的材料，找一个意外的联系</li></ul><blockquote>读完以后，各留下一句话：它改变了我的什么想法？</blockquote><h2>留白</h2><p>不需要把每一分钟都填满。有时候，连接是在放下材料以后才出现的。</p>' },
    { id:'ideas', title:'一些还没展开的想法', category:'随手记', html:'<p class="eyebrow">SCRATCHPAD / 先留在这里</p><h2>关于阅读的空间</h2><p>不是所有打开的东西都要一直占着眼前的位置。但“暂时不看”和“不再需要”，显然是两件不同的事。</p><p>如果一篇笔记能像一张纸一样收进旁边，桌面就可以始终留给眼下正在想的问题。</p><blockquote>让内容留下来，让界面空出来。</blockquote><h2>以后再想</h2><ul><li>卡片怎样才足够好认？</li><li>收起时，能不能让人明确看到它去了哪里？</li></ul>' }
  ];
  let pages, opened, active, busy = false, shelfOpen = false, filter = 'all', menuId = null;
  let lastDeleted = null, toastTimer, toastAction = null, serial = 0;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  function escape(value) { return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }
  function pageById(id) { return pages.find(page => page.id === id); }
  function title(page) { return page.title.trim() || '未命名页面'; }
  function capture() {
    const page = pageById(active);
    if (!page) return;
    page.title = $('page-title').value;
    page.html = $('editor').innerHTML;
    page.scroll = $('viewport').scrollTop;
  }
  function renderTabs() {
    $('tabs').innerHTML = opened.map(id => {
      const page = pageById(id);
      return `<div class="tab ${id === active ? 'active' : ''}"><span class="tab-dot" aria-hidden="true"></span><button class="tab-select" role="tab" id="tab-${id}" data-open="${id}" aria-selected="${id === active}" aria-controls="viewport" title="${escape(title(page))}">${escape(title(page))}</button><button class="minimize" data-minimize="${id}" aria-label="收起 ${escape(title(page))}" title="收起页面 · 内容会保留">${icon('minus')}</button></div>`;
    }).join('');
  }
  function renderCards() {
    const query = $('search').value.trim().toLocaleLowerCase();
    const visible = pages.filter(page => (filter === 'all' || !opened.includes(page.id)) && title(page).toLocaleLowerCase().includes(query));
    $('cards').innerHTML = visible.map(page => {
      const isOpen = opened.includes(page.id);
      return `<div class="card ${active === page.id ? 'active' : ''}" data-card="${page.id}"><button class="card-open" data-open="${page.id}" aria-label="打开 ${escape(title(page))}"><div class="card-sheet"><div class="thumbnail" aria-hidden="true" inert><h1>${escape(title(page))}</h1><div class="prose">${page.html}</div></div><div class="card-shade"></div><span class="badge ${isOpen ? '' : 'shelved'}">${active === page.id ? '正在阅读' : isOpen ? '已打开' : '已收起'}</span></div><div class="card-label"><span class="card-title">${escape(title(page))}</span><span class="card-number">${String(pages.indexOf(page)+1).padStart(2,'0')}</span></div></button><button class="icon-button card-more" data-menu="${page.id}" aria-label="${escape(title(page))} 的更多操作" aria-expanded="${menuId === page.id}">${icon('more')}</button>${menuId === page.id ? `<div class="card-menu"><button data-delete="${page.id}">${icon('trash')}删除页面</button></div>` : ''}</div>`;
    }).join('') || '<div class="cards-empty">' + (query ? '没有找到这一页' : filter === 'shelved' ? '还没有收起的页面' : '这里还没有页面') + '</div>';
    $('all-count').textContent = pages.length;
    $('shelved-count').textContent = pages.length - opened.length;
    $('page-count').textContent = pages.length;
    root.querySelectorAll('[data-filter]').forEach(button => { button.classList.toggle('active', button.dataset.filter === filter); button.setAttribute('aria-pressed', button.dataset.filter === filter); });
  }
  function renderPaper() {
    const page = pageById(active);
    $('paper').hidden = !page;
    $('empty').hidden = !!page;
    if (page) {
      $('page-title').value = page.title;
      $('editor').innerHTML = page.html;
      $('paper-category').textContent = page.category;
      $('paper-status').textContent = '演示草稿 · 可以直接编辑';
      $('viewport').setAttribute('aria-labelledby', `tab-${page.id}`);
      $('viewport').scrollTop = page.scroll || 0;
    } else {
      $('viewport').removeAttribute('aria-labelledby');
      $('empty-title').textContent = pages.length ? '桌面清空了，页面还在。' : '给一个新想法，留一页空白。';
      $('empty-copy').innerHTML = pages.length ? '它们被收在左侧。<br>打开页面列表，继续刚才的思路。' : '页面列表也清空了。<br>你可以新建一页，或撤销刚才的删除。';
      $('empty-action').textContent = pages.length ? '查看收起的页面' : '新建页面';
    }
  }
  function render() { renderTabs(); renderCards(); renderPaper(); }
  function setShelf(show, focus = true) {
    shelfOpen = show; menuId = null;
    $('shelf').classList.toggle('visible', show);
    $('shelf').inert = !show;
    $('backdrop').classList.toggle('visible', show);
    $('shelf-toggle').setAttribute('aria-expanded', show);
    // The drawer overlays the editor; keep keyboard navigation in the visible controls.
    root.querySelector('.main').inert = show;
    if (show) { capture(); renderCards(); if (focus) $('search').focus({preventScroll:true}); }
    else if (focus) $('shelf-toggle').focus({preventScroll:true});
  }
  function notify(message, action = null, label = '', persistent = false) {
    clearTimeout(toastTimer);
    $('toast-message').textContent = message;
    toastAction = action;
    $('toast-action').textContent = label;
    $('toast-action').hidden = !action;
    $('toast').classList.add('visible');
    if (!persistent) toastTimer = setTimeout(() => $('toast').classList.remove('visible'), 4200);
  }
  function softNotify(message) { if (!lastDeleted) notify(message, () => setShelf(true), '查看页面'); }
  function lock(value) { busy = value; root.inert = value; root.setAttribute('aria-busy', value); }
  function paperGhost() {
    const paper = $('paper'), raw = paper.getBoundingClientRect(), view = $('viewport').getBoundingClientRect();
    const top = Math.max(raw.top, view.top), bottom = Math.min(raw.bottom, view.bottom);
    if (bottom <= top) return null;
    const rect = {left:raw.left, top, width:raw.width, height:bottom-top};
    const ghost = document.createElement('div'); ghost.className = 'flight'; ghost.setAttribute('aria-hidden','true'); ghost.inert = true;
    Object.assign(ghost.style, {left:`${rect.left}px`,top:`${rect.top}px`,width:`${rect.width}px`,height:`${rect.height}px`});
    const clone = paper.cloneNode(true);
    clone.removeAttribute('id'); clone.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
    clone.style.transform = `translateY(${raw.top-top}px)`;
    clone.style.width = `${raw.width}px`;
    clone.querySelector('input').value = $('page-title').value;
    ghost.append(clone); document.body.append(ghost);
    return {ghost, rect};
  }
  async function fly(from, direction) {
    if (reducedMotion.matches) return;
    const copy = paperGhost(); if (!copy) return;
    const {ghost,rect} = copy;
    const transform = `translate(${from.left-rect.left}px,${from.top-rect.top}px) scale(${from.width/rect.width},${from.height/rect.height})`;
    const small = {transform, opacity:.22, borderRadius:'18px'};
    const full = {transform:'translate(0,0) scale(1,1)', opacity:1, borderRadius:'5px'};
    $('paper').style.visibility = 'hidden';
    try {
      await ghost.animate(direction === 'in' ? [full,{transform:`translate(${(from.left-rect.left)*.45}px,${(from.top-rect.top)*.2}px) scale(.8,.94)`,opacity:.92,offset:.42},small] : [small,full], {duration:$('slow').checked ? 1450 : direction === 'in' ? 620 : 480,easing:'cubic-bezier(.3,.05,.16,1)',fill:'forwards'}).finished;
    } finally { ghost.remove(); $('paper').style.visibility = ''; }
  }
  async function minimize(id) {
    if (busy || !opened.includes(id)) return;
    capture(); lock(true);
    try {
      if (active === id) await fly($('shelf-toggle').getBoundingClientRect(), 'in');
      const index = opened.indexOf(id); opened.splice(index,1);
      if (active === id) active = opened[Math.min(index,opened.length-1)] || null;
      render();
      if (!reducedMotion.matches) $('shelf-toggle').animate([{background:'#d0e0c5',transform:'scale(1.08)'},{background:'transparent',transform:'scale(1)'}],{duration:480});
      softNotify(`「${title(pageById(id))}」已收起，内容保留`);
    } finally { lock(false); }
    const nextTab = active && $(`tab-${active}`);
    (nextTab || $('shelf-toggle')).focus({preventScroll:true});
  }
  async function openPage(id, trigger) {
    if (busy || !pageById(id)) return;
    capture();
    const fromShelf = !!trigger?.closest('.card');
    const start = fromShelf ? trigger.querySelector('.card-sheet').getBoundingClientRect() : null;
    if (fromShelf) setShelf(false, false);
    if (!opened.includes(id)) opened.push(id);
    active = id; menuId = null; render();
    if (fromShelf) {
      lock(true);
      try { await fly(start, 'out'); } finally { lock(false); }
    }
    $(`tab-${id}`).scrollIntoView({block:'nearest',inline:'nearest'});
    $(`tab-${id}`).focus({preventScroll:true});
  }
  function newPage() {
    if (busy) return;
    capture(); setShelf(false,false);
    const id = `new-${++serial}`;
    pages.push({id,title:'未命名页面',category:'随手记',html:'<p>在这里，写下新的想法。</p>',scroll:0});
    opened.push(id); active = id; render();
    $(`tab-${id}`).scrollIntoView({block:'nearest',inline:'nearest'});
    $('page-title').focus(); $('page-title').select();
  }
  function deletePage(id) {
    if (busy) return;
    capture();
    const index = pages.findIndex(page => page.id === id); if (index < 0) return;
    lastDeleted = {page:pages[index], index, openIndex:opened.indexOf(id), wasActive:active === id};
    pages.splice(index,1);
    opened = opened.filter(value => value !== id);
    if (active === id) active = opened[Math.min(lastDeleted.openIndex,opened.length-1)] || null;
    menuId = null; render();
    notify(`已删除「${title(lastDeleted.page)}」`, undoDelete, '撤销删除', true);
    $('toast-action').focus({preventScroll:true});
  }
  function undoDelete() {
    if (!lastDeleted || busy) return;
    capture();
    const {page,index,openIndex,wasActive} = lastDeleted;
    pages.splice(Math.min(index,pages.length),0,page);
    if (openIndex >= 0) opened.splice(Math.min(openIndex,opened.length),0,page.id);
    if (wasActive || !active && openIndex >= 0) active = page.id;
    lastDeleted = null; render();
    notify('页面已恢复，内容和位置都还在。');
    if (shelfOpen) $('search').focus({preventScroll:true});
    else if (active) $(`tab-${active}`).focus({preventScroll:true});
  }
  function reset() {
    if (busy) return;
    pages = samples.map(page => ({...page,scroll:0})); opened = ['comparison','benchmark','pnas']; active = 'pnas';
    lastDeleted = null; filter = 'all'; menuId = null; $('search').value = '';
    clearTimeout(toastTimer); $('toast').classList.remove('visible'); toastAction = null;
    setShelf(false,false); render();
  }
  $('shelf-toggle').addEventListener('click', () => { if (!busy) setShelf(!shelfOpen); });
  $('shelf-close').addEventListener('click', () => setShelf(false));
  $('backdrop').addEventListener('click', () => setShelf(false));
  $('new-tab').addEventListener('click', newPage); $('rail-new').addEventListener('click', newPage);
  $('empty-action').addEventListener('click', () => pages.length ? setShelf(true) : newPage());
  $('reset').addEventListener('click', () => { reset(); $('shelf-toggle').focus({preventScroll:true}); });
  $('search').addEventListener('input', () => { menuId = null; renderCards(); });
  $('toast-action').addEventListener('click', () => toastAction?.());
  $('toast-close').addEventListener('click', () => { $('toast').classList.remove('visible'); lastDeleted = null; });
  root.addEventListener('click', event => {
    if (busy) return;
    const button = event.target.closest('button'); if (!button) return;
    if (button.dataset.minimize) void minimize(button.dataset.minimize);
    else if (button.dataset.open) void openPage(button.dataset.open,button);
    else if (button.dataset.menu) {
      menuId = menuId === button.dataset.menu ? null : button.dataset.menu; renderCards();
      const menu = root.querySelector('.card-menu button');
      if (menu) menu.focus({preventScroll:true});
      else root.querySelector(`[data-menu="${button.dataset.menu}"]`)?.focus({preventScroll:true});
    }
    else if (button.dataset.delete) deletePage(button.dataset.delete);
    else if (button.dataset.filter) { filter = button.dataset.filter; menuId = null; renderCards(); }
  });
  $('page-title').addEventListener('input', () => { capture(); renderTabs(); $('paper-status').textContent = '已保留在本次预览'; });
  $('page-title').addEventListener('blur', () => { const page = pageById(active); if (page && !page.title.trim()) { page.title = '未命名页面'; $('page-title').value = page.title; renderTabs(); } });
  $('editor').addEventListener('input', () => { capture(); $('paper-status').textContent = '已保留在本次预览'; });
  document.addEventListener('keydown', event => {
    if (busy) return;
    if (event.key === 'Escape' && menuId) {
      const previous = menuId; menuId = null; renderCards(); root.querySelector(`[data-menu="${previous}"]`)?.focus();
    } else if (event.key === 'Escape' && shelfOpen) setShelf(false);
    // Follow the tab pattern without taking arrow keys away from the editor.
    if (event.target.matches('.tab-select') && ['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) {
      event.preventDefault(); const index = opened.indexOf(event.target.dataset.open);
      const next = event.key === 'Home' ? 0 : event.key === 'End' ? opened.length-1 : (index+(event.key === 'ArrowRight' ? 1 : -1)+opened.length)%opened.length;
      void openPage(opened[next]);
    }
  });
  reset();
})();
</script>
</body>
</html>
